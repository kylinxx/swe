[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A lightweight coding agent built from scratch"
readme = "README.txt"
requires-python = ">=3.11"

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools]
packages = ["coding_agent"]

